name: First docker deployment

on: 
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up correct docker driver wich support cash
        uses: docker/setup-buildx-action@v3

            - name: Debug secrets check
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ DOCKER_USERNAME is EMPTY or not found"
            exit 1
          else
            echo "✅ DOCKER_USERNAME is set (length: ${#USERNAME})"
          fi
          
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "❌ DOCKER_PASSWORD is EMPTY or not found"
            exit 1
          else
            echo "✅ DOCKER_PASSWORD is set (length: ${#PASSWORD})"
          fi
        env:
          USERNAME: ${{ secrets.DOCKER_USERNAME }}
          PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . 
          push: true 
          tags: | #создаем 2 тега
            ${{ secrets.DOCKER_USERNAME }}/nodejs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/nodejs:latest

            docker stop nodejs || true
            docker rm nodejs || true

            docker run -d \
              --name nodejs \
              -p 8080:80 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/nodejs:latest
            
            docker image prune -f